<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/daily-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- `viewport-fit=cover` asks for the whole screen, so the app draws under
       the clock instead of iOS keeping that strip and painting it itself. It is
       also what gives `env(safe-area-inset-top)` a height, which is where
       phone_frame's PhoneSafeArea takes the top inset from — no inset is
       written in Dart. Flutter's engine replaces this meta on boot; the
       MutationObserver at the bottom of the body puts `cover` back. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Planificación de contenido para equipos.">

  <!-- Browser/PWA chrome colour: Android Chrome, the desktop toolbar, Safari's
       own bar — and, since the status bar style below went back to `default`,
       the strip the clock sits in on an installed iOS PWA. The two values are
       the app's `--bg`.

       A pair keyed on `prefers-color-scheme` answers with the *phone's*
       appearance, which is not always the app's: on a phone set to dark with
       the app set to light, iOS painted that strip near-black and faded it
       down over a light app. That grey wash over the header was read as a
       blur the system was applying, and it was mostly this. The script below
       replaces the pair with the one colour the app is actually going to
       paint. -->
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <script>
    // The app's own choice, out of the same store the app keeps it in
    // (`shared_preferences` writes `flutter.`-prefixed JSON into
    // localStorage). Before the engine, because iOS reads the meta at launch
    // and never again — a theme changed inside the app lands on the strip the
    // next time it opens.
    (function () {
      var mode = 'system';
      try {
        var raw = window.localStorage.getItem('flutter.settings.themeMode');
        if (raw) mode = String(raw).replace(/"/g, '');
      } catch (e) {
        // Private browsing, or storage the browser will not hand over: the
        // system's answer is the right fallback.
      }
      var dark =
        mode === 'dark' ||
        (mode !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
      var colour = dark ? '#09090b' : '#fafafa';

      // What the page *is*, which is not what the phone prefers. iOS paints
      // the strip the clock sits in out of this: a light app on a phone set to
      // dark was handed the dark material and faded it down over the app's own
      // header, which is the band this whole hunt was about. Declared and not
      // left to `prefers-color-scheme`, because the app has a switch of its
      // own and it wins.
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

      // And the page's own background, which is what iOS samples at the top
      // edge to colour that strip. The rules below key it on
      // `prefers-color-scheme`, so a light app on a dark phone had a dark
      // *page* under a light canvas — and the strip came out dark. This says
      // what the app paints; the media queries stay as the answer for a
      // browser that never runs this.
      var sheet = document.createElement('style');
      sheet.textContent =
        'html, body { background-color: ' + colour + ' !important; }';
      document.head.appendChild(sheet);
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].remove();
      var meta = document.createElement('meta');
      meta.setAttribute('name', 'theme-color');
      meta.setAttribute('content', colour);
      document.head.appendChild(meta);

      // The engine writes a `theme-color` of its own once it boots —
      // `#2196f3`, Material's blue, which is nobody's colour here and was
      // winning by being last. It is left in place and corrected rather than
      // removed: the engine holds a reference to it.
      new MutationObserver(function () {
        var all = document.querySelectorAll('meta[name="theme-color"]');
        for (var j = 0; j < all.length; j++) {
          if (all[j] !== meta && all[j].getAttribute('content') !== colour) {
            all[j].setAttribute('content', colour);
          }
        }
      }).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
    })();
  </script>

  <!-- iOS "Add to Home Screen" (standalone PWA).

       This was `black-translucent`, which with `viewport-fit=cover` handed the
       clock's strip to the app: the background ran up under it and iOS drew
       the clock on top. On iOS 27 the system started painting a blurred
       gradient over the top edge of an installed web app — over the app's own
       header, not just the strip — and washing out everything under it. The
       band is painted above the web view, so no CSS of ours can reach it; what
       we can do is stop asking for that space. With `default` the web view
       starts below the status bar, iOS paints the strip the `theme-color`
       above, and there is nothing of ours under the band for it to wash out.

       `viewport-fit=cover` stays: the inset that matters now is the bottom one,
       for the home indicator, and it is still ours to respect.

       Two things to know before changing this value again. Apple has deprecated
       `black-translucent` and iOS 26 had already lost its transparency; and iOS
       freezes whichever value it read when the app was added to the Home
       Screen, so an existing installation keeps the old behaviour until it is
       removed and added again. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <!-- iOS masks and rounds this itself, so it points at the flat opaque
       square, not the already-rounded manifest icon. -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/apple-touch-icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/apple-touch-icon-512.png">

  <!-- Firebase's SDK and Firestore are asked for by Dart, long after the page
       starts parsing — by then the handshake has not begun. Warming it here
       means the app is not waiting on DNS and TLS at the moment it wants to
       know who is signed in. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>

  <title>Daily</title>
  <link rel="manifest" href="manifest.json">

  <!-- Which build this page is, stamped by tool/finish_web_build.dart after
       the build. The script at the bottom of the body compares it with the
       version.json on the server: that is what keeps a cached page from
       being yesterday's app. -->
  <meta name="daily-build" content="215">

  <style>
    /* The page behind the Flutter view. Matches the app's `--bg` so the strips
       around the view never flash white.

       `100vh`, NOT `100%`: under `cover`, `100%` does not count the area behind
       the status bar, so the document comes out shorter than the screen and a
       band of background is left along the bottom. And do not add
       `env(safe-area-inset-top)` on top of it — `100vh` is already the whole
       screen, and the extra overshoots, pushing anything anchored to the bottom
       off the edge. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #fafafa;
      /* No rubber-band past the edges: in a standalone PWA that bounce shows
         the page background behind the app and reads as a bug. */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #09090b; }
    }

    /* Hosts the Flutter view, at the document's own height, so the engine
       measures THIS element (through its ResizeObserver) rather than
       `documentElement.clientHeight` — which under `cover` leaves out the top
       safe area and hands the app a viewport shorter than the screen. */
    #flutter-host { position: fixed; top: 0; left: 0; right: 0; height: 100vh; }

    /* The strip at the top that belongs to iOS 27.

       It paints a blurred band over the first ~25px of an installed web app
       and there is no way to refuse it: a page of ruled lines, with no canvas
       and no scrolling, gets the same treatment. What a page can do is not
       draw there — over an unbroken background the band has nothing to smear
       and stops being visible. The gap is the page's own background, which is
       the colour the app paints anyway.

       Three gates, and each one keeps this out of a place it does not belong.
       `display-mode: standalone`, because in a browser tab the band lands on
       the browser's chrome and the page never sees it — a tab looks exactly as
       it always did. `pointer: coarse`, because a web app installed on a
       desktop has no band and should not get a gap. And the subtraction,
       because where the system asks for a real inset — every iOS before this
       one — the app is already clear of the band and this must come to zero
       rather than pile on top.

       DELETE THIS BLOCK when iOS stops painting the band. Nothing else in the
       page is holding it up: see "A faixa do iOS 27" in docs/web-deploy.md for
       what was measured and what did not work. */
    @media (display-mode: standalone) and (pointer: coarse) {
      #flutter-host {
        top: max(0px, calc(30px - env(safe-area-inset-top, 0px)));
        height: calc(100vh - max(0px, calc(30px - env(safe-area-inset-top, 0px))));
      }
    }

    /* Something turning while the app arrives. On a phone the bundle is a
       few megabytes and the screen is the background colour until the first
       frame: a blank screen for four seconds is indistinguishable from an app
       that is not coming. It is CSS and nothing else — a spinner that waited
       for the app to load would be beside the point. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Not at once: a load that finishes quickly should not flash a spinner
         on the way past. */
      opacity: 0;
      animation: boot-in .2s ease-out .45s forwards;
    }
    #boot i {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(9, 9, 11, .14);
      border-top-color: rgba(9, 9, 11, .55);
      animation: boot-spin .7s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      #boot i {
        border-color: rgba(250, 250, 250, .16);
        border-top-color: rgba(250, 250, 250, .6);
      }
    }
    @keyframes boot-in { to { opacity: 1; } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    The app is served from a cache of its own (web/daily_service_worker.js),
    which is what makes the installed PWA open at once instead of downloading
    five megabytes again. Registered here, because Flutter's loader only
    registers a worker where one already is.

    The price of a cache is that what it serves is what it had last time, so a
    deploy would take an extra launch to appear — long enough for a fix to be
    live, verified on the server, and still not be what the phone is running.
    This is what buys it back: the build stamped in the <meta> above against
    the version.json on the server, asked for with a query string and
    `no-store` so it comes from the network and not from either cache.
    Different means what we are running is old — so the caches go, the worker
    goes, and the page loads once more from scratch. Once: the flag is keyed
    by the build that asked for the reload, so a cache that refuses to clear
    cannot put the app in a loop.
  -->

    (function () {
      if (!('serviceWorker' in navigator)) return;
      var stamp = document.querySelector('meta[name="daily-build"]');
      var mine = stamp ? stamp.content : 'dev';

      function register() {
        navigator.serviceWorker.register('daily_service_worker.js')
          .catch(function () { /* no cache this time; the app still runs */ });
      }

      // `dev` is an unstamped build — `flutter run`, or a build someone
      // published by hand. Caching it would cache whatever was on screen at
      // the time and keep serving it.
      if (mine === 'dev' || !window.caches) return;

      var asked = 'daily-reload-' + mine;
      fetch('version.json?ts=' + Date.now(), {cache: 'no-store'})
        .then(function (answer) { return answer.json(); })
        .then(function (fresh) {
          if (String(fresh.build_number) === mine) {
            register();
            return;
          }
          try {
            if (sessionStorage.getItem(asked)) { register(); return; }
            sessionStorage.setItem(asked, '1');
          } catch (e) { /* private mode: one reload is still better */ }
          caches.keys()
            .then(function (names) {
              return Promise.all(names.map(function (name) {
                return caches.delete(name);
              }));
            })
            .then(function () {
              return navigator.serviceWorker.getRegistrations()
                .then(function (all) {
                  return Promise.all(all
                    // Not the push worker. It is registered under `push/`,
                    // it holds this browser's subscription, and sweeping it
                    // away with the stale cache would turn notifications off
                    // on every deploy — silently, and only for the people
                    // who had asked for them.
                    .filter(function (one) {
                      return one.scope.indexOf('/push/') === -1;
                    })
                    .map(function (one) { return one.unregister(); }));
                });
            })
            .then(function () { location.reload(); });
        })
        .catch(function () { register(); });
    })();
  </script>

  <script>
    /* Flutter's engine removes every viewport meta on the page and writes its
       own, which has no `viewport-fit` — and it measures the page right after,
       during initialization, so putting it back from Dart is too late. This
       puts `cover` back the moment the engine's meta appears. */
    new MutationObserver(function () {
      var m = document.querySelector('meta[name="viewport"]');
      if (m && m.content.indexOf('viewport-fit') === -1) {
        m.content += ', viewport-fit=cover';
      }
    }).observe(document.head, {childList: true, subtree: true, attributes: true});
  </script>

  <div id="boot"><i></i></div>
  <div id="flutter-host"></div>
  <script>
    /* The engine says when it has painted something; until then the spinner
       is the only thing on the screen. */
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();

      /* And then tell the worker what this load cost, so the next one costs
         nothing. A couple of seconds later than the first frame: the last of
         the deferred parts is usually still arriving. */
      if (!('serviceWorker' in navigator)) return;
      setTimeout(function () {
        navigator.serviceWorker.ready.then(function (registration) {
          var worker = registration.active;
          if (!worker) return;
          worker.postMessage({
            type: 'daily-cache',
            urls: performance.getEntriesByType('resource').map(function (e) {
              return e.name;
            }),
          });
        }).catch(function () { /* no worker; nothing to tell */ });
      }, 2000);
    });
  </script>
